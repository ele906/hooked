services:
  # Backend service
  - type: web
    name: hooked-1a46
    runtime: python
    buildCommand: "cd backend && pip install -r ../requirements.txt"
    startCommand: "cd backend && python app.py"
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: FRONTEND_URL
        value: "https://hooked-fe.onrender.com"
      - key: ALLOWED_ORIGINS
        value: "https://hooked-fe.onrender.com"

  # Frontend service — serves the static build via `serve`, not the CRA dev
  # server (which rejects non-localhost Host headers, hence "Invalid Host
  # header"). `-s` makes serve fall back to index.html for client-side routes.
  - type: web
    name: hooked-fe
    runtime: node
    buildCommand: "cd frontend && npm install && npm run build"
    startCommand: "cd frontend && npx serve -s build -l $PORT"
    envVars:
      - key: REACT_APP_API_URL
        value: "https://hooked-1a46.onrender.com"
