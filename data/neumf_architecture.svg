<svg width="680" height="850" viewBox="0 0 680 850" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
<rect x="0" y="0" width="680" height="850" fill="#ffffff"/>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#333333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<!-- Tower containers -->
<rect x="35" y="384" width="295" height="246" rx="20" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 4"/>
<text x="50" y="404" font-size="14" font-weight="bold" fill="#333333">GMF path</text>
<rect x="350" y="384" width="280" height="426" rx="20" fill="none" stroke="#888888" stroke-width="1" stroke-dasharray="4 4"/>
<text x="365" y="404" font-size="14" font-weight="bold" fill="#333333">MLP path</text>

<!-- GMF input -->
<rect x="55" y="580" width="130" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="120" y="605" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">User ID</text>
<rect x="200" y="580" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="260" y="605" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Item ID</text>
<line x1="120" y1="580" x2="120" y2="534" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="260" y1="580" x2="260" y2="534" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- GMF embeddings -->
<rect x="55" y="490" width="130" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="120" y="509" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle">User embed</text>
<text x="120" y="527" font-size="12" fill="#3C3489" text-anchor="middle">16-dim</text>
<rect x="200" y="490" width="120" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="260" y="509" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle">Item embed</text>
<text x="260" y="527" font-size="12" fill="#3C3489" text-anchor="middle">16-dim</text>
<line x1="120" y1="490" x2="150" y2="450" stroke="#999999" stroke-width="1"/>
<line x1="260" y1="490" x2="220" y2="450" stroke="#999999" stroke-width="1"/>

<!-- GMF product -->
<rect x="85" y="394" width="200" height="56" rx="10" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="185" y="418" font-size="14" font-weight="bold" fill="#4A1B0C" text-anchor="middle">Element-wise product</text>
<text x="185" y="437" font-size="12" fill="#712B13" text-anchor="middle">GMF output, 16-dim</text>

<!-- MLP input -->
<rect x="360" y="760" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="420" y="785" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">User ID</text>
<rect x="495" y="760" width="120" height="40" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="555" y="785" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Item ID</text>
<line x1="420" y1="760" x2="420" y2="714" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="555" y1="760" x2="555" y2="714" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- MLP embeddings -->
<rect x="360" y="670" width="120" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="420" y="689" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle">User embed</text>
<text x="420" y="707" font-size="12" fill="#3C3489" text-anchor="middle">16-dim</text>
<rect x="495" y="670" width="120" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="555" y="689" font-size="14" font-weight="bold" fill="#26215C" text-anchor="middle">Item embed</text>
<text x="555" y="707" font-size="12" fill="#3C3489" text-anchor="middle">16-dim</text>
<line x1="420" y1="670" x2="450" y2="624" stroke="#999999" stroke-width="1"/>
<line x1="555" y1="670" x2="530" y2="624" stroke="#999999" stroke-width="1"/>

<!-- MLP concat -->
<rect x="390" y="580" width="200" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="490" y="599" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle">Concatenate</text>
<text x="490" y="617" font-size="12" fill="#085041" text-anchor="middle">32-dim</text>
<line x1="490" y1="580" x2="490" y2="534" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- MLP linear1 -->
<rect x="390" y="490" width="200" height="44" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="490" y="509" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle">Linear(32 → 16)</text>
<text x="490" y="527" font-size="12" fill="#085041" text-anchor="middle">ReLU</text>
<line x1="490" y1="490" x2="490" y2="450" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- MLP linear2 / output -->
<rect x="390" y="394" width="200" height="56" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="490" y="418" font-size="14" font-weight="bold" fill="#04342C" text-anchor="middle">Linear(16 → 8), ReLU</text>
<text x="490" y="437" font-size="12" fill="#085041" text-anchor="middle">MLP output, 8-dim</text>

<!-- Merge into fusion -->
<line x1="185" y1="394" x2="300" y2="344" stroke="#999999" stroke-width="1"/>
<line x1="490" y1="394" x2="380" y2="344" stroke="#999999" stroke-width="1"/>

<!-- Fusion: concat 24-dim -->
<rect x="230" y="288" width="220" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="312" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Concatenate</text>
<text x="340" y="331" font-size="12" fill="#444441" text-anchor="middle">GMF (16) + MLP (8) = 24-dim</text>
<line x1="340" y1="288" x2="340" y2="248" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Linear 24 to 1 -->
<rect x="260" y="204" width="160" height="44" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="223" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Linear(24 → 1)</text>
<text x="340" y="241" font-size="12" fill="#444441" text-anchor="middle">single logit</text>
<line x1="340" y1="204" x2="340" y2="164" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Sigmoid -->
<rect x="260" y="124" width="160" height="40" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="149" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Sigmoid</text>
<line x1="340" y1="124" x2="340" y2="86" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Output score -->
<rect x="230" y="30" width="220" height="56" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="1"/>
<text x="340" y="54" font-size="14" font-weight="bold" fill="#2C2C2A" text-anchor="middle">Match score</text>
<text x="340" y="73" font-size="12" fill="#444441" text-anchor="middle">Predicted preference, 0-1</text>
</svg>
